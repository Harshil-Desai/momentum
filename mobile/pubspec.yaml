name: mobile
description: "Cadence - Find Your Rhythm."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  go_router: ^17.2.3
  dio: ^5.9.2
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2
  path: ^1.9.0
  connectivity_plus: ^7.1.1
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  permission_handler: ^12.0.1
  google_fonts: ^8.1.0
  uuid: ^4.5.3
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.2
  sentry_flutter: ^9.20.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/habits/
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 23
  web:
    generate: false
